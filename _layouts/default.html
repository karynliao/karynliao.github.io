<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page.title and page.url != "/" %}{{ page.title }} · {% endif %}{{ site.data.site.name }}</title>
<meta name="description" content="{{ page.summary | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.data.site.name }}</a>
    <nav class="main" aria-label="Main">
      <a href="{{ '/#work' | relative_url }}">Work</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == "/about/" %} aria-current="page"{% endif %}>About</a>
      <a href="{{ '/#contact' | relative_url }}">Contact</a>
    </nav>
  </div>
</header>
<main>
{{ content }}
</main>
<footer>
  <div class="wrap"><span>© {{ site.time | date: "%Y" }} {{ site.data.site.name }}</span><a href="{{ site.data.site.linkedin }}" target="_blank" rel="noopener">LinkedIn ↗</a></div>
</footer>
</body>
</html>
